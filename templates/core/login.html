<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Administrativo-Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a3a5c 0%, #2c5f8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .login-header {
            background-color: #212529;
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
        }
        .login-header h4 {
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .login-header small {
            color: #adb5bd;
        }
        .login-body {
            padding: 30px;
        }
        .login-footer {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 14px 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-bank2" style="font-size: 2.2rem; color: #0d6efd;"></i>
            <h4 class="mt-2">PROJETO FINANCEIRO</h4>
            <small>Sistema Administrativo-Financeiro - UniRV</small>
        </div>
        <div class="login-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }} py-2 px-3 small">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        {{ form.username }}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        {{ form.password }}
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
                </button>
            </form>
        </div>
        <div class="login-footer">
            <div>Credenciais Padrão: <code>admin</code> / <code>admin123</code></div>
            <div class="mt-1">Git Commit: <span class="badge bg-secondary">{{ ULTIMA_ATUALIZACAO_GITHUB }}</span></div>
        </div>
    </div>
</body>
</html>
